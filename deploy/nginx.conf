# Eye Level Learning Center of Hicksville — Nginx server block excerpt
# Include inside your server { } or adapt as a full site config.

# Redirect non-www and http to https://www.myeyelevelhicksville.com
server {
    listen 80;
    listen [::]:80;
    server_name myeyelevelhicksville.com www.myeyelevelhicksville.com;
    return 301 https://www.myeyelevelhicksville.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myeyelevelhicksville.com;
    return 301 https://www.myeyelevelhicksville.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myeyelevelhicksville.com;

    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/myeyelevelhicksville;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src https://www.openstreetmap.org; base-uri 'self'; form-action 'self'" always;

    # Legacy 301 redirects
    location = /US/index.do {
        return 301 /;
    }
    location = /US/programs/math.do {
        return 301 /math-tutoring-hicksville/;
    }
    location = /US/programs/english.do {
        return 301 /english-tutoring-hicksville/;
    }
    location = /US/customer/contact-us.do {
        return 301 /contact/;
    }
    location = /US/footer/faq.do {
        return 301 /faq/;
    }

    # Cache static assets
    location ~* \.(svg|webp|avif|png|jpg|jpeg|gif|ico|css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # True 404 — never soft-redirect unknown URLs to the homepage
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
