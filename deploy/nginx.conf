# Nginx Server Configuration for Eye Level Learning Center of Hicksville
# Canonical Domain: https://www.myeyelevelhicksville.com

# 1. Non-SSL & Non-WWW Redirects
server {
    listen 80;
    listen [::]:80;
    server_name myeyelevelhicksville.com www.myeyelevelhicksville.com;
    return 301 https://www.myeyelevelhicksville.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myeyelevelhicksville.com;

    ssl_certificate /etc/letsencrypt/live/myeyelevelhicksville.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myeyelevelhicksville.com/privkey.pem;

    return 301 https://www.myeyelevelhicksville.com$request_uri;
}

# 2. Main Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myeyelevelhicksville.com;

    root /var/www/myeyelevelhicksville/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/myeyelevelhicksville.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myeyelevelhicksville.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # 3. 301 Redirect Rules for Legacy Eye Level URLs
    # Query string handling for /US/index.do?country=US&lang=en
    location = /US/index.do {
        if ($arg_country = "US") {
            return 301 https://www.myeyelevelhicksville.com/;
        }
        return 301 https://www.myeyelevelhicksville.com/;
    }

    location = /US/programs/math.do {
        return 301 https://www.myeyelevelhicksville.com/math-tutoring-hicksville/;
    }

    location = /US/programs/english.do {
        return 301 https://www.myeyelevelhicksville.com/english-tutoring-hicksville/;
    }

    location = /US/customer/contact-us.do {
        return 301 https://www.myeyelevelhicksville.com/contact/;
    }

    location = /US/footer/faq.do {
        return 301 https://www.myeyelevelhicksville.com/faq/;
    }

    # 4. Static Asset Caching
    location ~* \.(?:css|js|woff2?|svg|jpg|jpeg|png|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 5. Clean URLs and SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 6. Error 404 Handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
